name: Tests

# Runs the same two test sets as on Alvin's Mac (see tests/README.md and
# sim/README.md) on every push to any branch and on every pull request.
# Changes nothing live: the rules tests use the local Firestore emulator and
# the simulations drive a copy of the site with Firebase switched off.
on:
  push:
    branches: ['**']
  pull_request:

# Only the newest commit on a branch matters; an older run still going is cancelled.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Same conventions as patient-hub's ci.yml: a named runner image (not
# ubuntu-latest), GitHub-authored actions only, each pinned by commit hash,
# and a short timeout on every job so a hung test cannot run for six hours.
jobs:
  rules-and-unit:
    name: Database rules and unit tests (Firestore emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Firestore emulator is a Java program.
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      # firebase-tools downloads the emulator on first use; keep it between runs.
      - name: Cache the Firestore emulator download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      - name: Install test tools
        run: npm ci

      - name: Run the rules and unit tests
        run: npm test

  sims:
    name: Round simulations (real UI in headless Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sim
    env:
      # The runner image ships Google Chrome; sim/drive.mjs uses $CHROME first.
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sim/package-lock.json

      - name: Install test tools
        run: npm ci

      - name: Check Chrome is there
        run: '"$CHROME" --version'

      # Same as on the Mac: builds sim/site (make-site.sh), then scenarios,
      # foundations, e2e, score, auth and 40 random rounds.
      - name: Run the simulations
        run: npm test
