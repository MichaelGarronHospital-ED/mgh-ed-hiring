<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Physician Hiring</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/ed-ui.css?v=R7" />
<link rel="stylesheet" href="css/styles.css?v=R7" />
</head>
<body>
<!-- login gate: the ED, Leadership or Guest password; the role is whichever account accepts it (R7) -->
<div id="gate" class="overlay" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="overlay-box">
    <div class="logo" aria-hidden="true">ED</div>
    <h2 id="gateTitle">Physician Hiring</h2>
    <p class="muted">Enter your password to continue.</p>
    <form id="gateForm" autocomplete="off">
      <label class="ed-label gatelabel" for="gpw">Password
        <input id="gpw" type="password" autocomplete="off" autofocus /></label>
      <button id="gbtn" class="primary" type="submit">Enter</button>
    </form>
    <div id="gerr" class="err" role="alert" aria-live="assertive"></div>
  </div>
</div>

<!-- pick your name (committee identity) -->
<div id="memberpick" class="overlay hidden">
  <div class="overlay-box">
    <div class="logo" aria-hidden="true">ED</div>
    <h2>Who are you?</h2>
    <p class="muted">Pick your name so your input is saved to you.</p>
    <div id="roleLine" class="note"></div>
    <select id="memberSel" aria-label="Your name"></select>
    <p class="muted small pickhint">Not on the list? Ask leadership to add you.</p>
    <button id="memberBtn" class="primary">Continue</button>
    <button id="adminOnlyBtn" class="linky hidden" style="margin-top:16px">Continue as admin, without a name</button>
  </div>
</div>

<!-- candidate self-scheduling (same link, Guest password) -->
<div id="candview" class="hidden"></div>

<header id="appHeader" class="hidden">
  <div class="brandrow">
    <div class="brandmark" aria-hidden="true">ED</div>
    <div class="grow"><h1 id="orgName">Physician Hiring</h1></div>
    <button id="setupBtn" class="iconbtn hidden" title="Setup: committee, chair, times, applications folder" aria-label="Setup">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button id="logout" class="linky">Log out</button>
  </div>
  <div class="who">
    <span>Signed in as <b id="whoLine"></b></span>
    <button id="changeMember" class="linky">Change</button>
    <span id="adminTag" class="tag hidden">Admin</span>
    <span id="saveStatus" class="saveflag hidden" aria-live="polite"></span>
  </div>
</header>

<div id="banner" class="banner hidden" aria-live="polite"></div>
<div id="updateLine" class="updline hidden" role="status" aria-live="polite"></div>
<div id="roundLine" class="updline roundline hidden" role="status" aria-live="polite"></div>

<nav id="tabs" class="tabs hidden" role="tablist" aria-label="Hiring stages"></nav>

<main id="app" class="hidden">
  <section id="screen" role="tabpanel"></section>
  <section id="availability" class="hidden" role="tabpanel"></section>
  <section id="score" class="hidden" role="tabpanel"></section>
  <section id="panels" class="hidden" role="tabpanel"></section>
  <section id="ranking" class="hidden" role="tabpanel"></section>
</main>

<!-- Setup opens as a modal over the current page (admin only) -->
<div id="setupModal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="setupTitle">Setup</h2>
      <button id="setupClose" class="iconbtn" aria-label="Close setup">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="settings" class="modal-body"></div>
  </div>
</div>

<!-- lightweight confirm dialog -->
<div id="confirmWrap" class="overlay hidden"
     role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMsg">
  <div class="overlay-box">
    <h2 id="confirmTitle">Are you sure?</h2>
    <p id="confirmMsg" class="muted"></p>
    <div class="row" style="justify-content:flex-end; gap:8px; margin-top:20px; flex-wrap:wrap">
      <button id="confirmNo" class="btn ghost">Cancel</button>
      <button id="confirmAlt" class="btn tinted" hidden></button>
      <button id="confirmYes" class="btn danger">Confirm</button>
    </div>
  </div>
</div>

<!-- multi-step dialog (util.js flowDialog) -->
<div id="flowWrap" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="flowTitle">
  <div class="overlay-box flowbox">
    <h2 id="flowTitle"></h2>
    <div id="flowBody"></div>
    <div id="flowBtns" class="row flowbtns"></div>
  </div>
</div>

<div id="toast" class="toast hide" role="status" aria-live="polite"></div>

<!-- Last-resort net, before the module so it is already listening.
     If js/app.js never loads or never parses (a browser too old for the
     syntax, a blocked or corrupted script, a proxy serving something else),
     no handler is ever attached, so the page looks fine and the Enter button
     simply does nothing. That is indistinguishable from "my code is wrong",
     and it is what someone reports as "I can't log in on my phone".
     Deliberately ES5: it has to run on the browsers that can't parse the app. -->
<script>
(function () {
  var shown = false;
  function fatal(msg) {
    if (shown) return;
    shown = true;
    var e = document.getElementById("gerr");
    if (e) e.innerHTML = '<div style="text-align:left">' + msg + "</div>";
  }
  window.addEventListener("error", function (ev) {
    var m = (ev && ev.message) || "";
    if (/SyntaxError|Unexpected token|Unexpected identifier|is not a function|is not a constructor/.test(m))
      fatal("This browser can’t run the sign-in page. It is most likely too old. " +
            "Update iOS or Android, or try Safari or Chrome on another device.");
  });
  window.addEventListener("DOMContentLoaded", function () {
    setTimeout(function () {
      if (!window.__edReady)
        fatal("The page didn’t finish loading, so signing in won’t work yet. Reload. " +
              "If you are on a hospital network or using a content blocker, try mobile data.");
    }, 8000);
  });
})();
</script>
<script type="module" src="js/app.js?v=R8"></script>
</body>
</html>
