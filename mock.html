<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ED Hiring Tool — MOCK</title>
<style>
  :root { --ink:#1a1a1a; --mut:#666; --line:#e2e2e2; --bg:#fafafa;
          --green:#137333; --red:#c5221f; --blue:#1a56db; --amber:#b35900; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,sans-serif; color:var(--ink);
         margin:0; line-height:1.45; background:#fff; }
  .mock-banner { background:#fff3cd; color:#7a5b00; border-bottom:1px solid #f0d97a;
         text-align:center; font-size:.82rem; padding:.4rem; font-weight:600; }
  header { padding:1rem 1.1rem .5rem; }
  h1 { font-size:1.25rem; margin:.1rem 0; }
  .sub { color:var(--mut); font-size:.85rem; margin:0; }
  .who { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; font-size:.85rem; margin:.7rem 0 .2rem; }
  .who select { font:inherit; padding:.3rem .5rem; border:1px solid var(--line); border-radius:7px; background:#fff; }
  nav.tabs { display:flex; gap:.25rem; padding:0 1.1rem; border-bottom:1px solid var(--line);
         position:sticky; top:0; background:#fff; z-index:5; overflow-x:auto; }
  nav.tabs button { font:inherit; border:none; background:none; padding:.6rem .7rem;
         border-bottom:3px solid transparent; color:var(--mut); cursor:pointer; white-space:nowrap; }
  nav.tabs button.on { color:var(--ink); border-bottom-color:var(--blue); font-weight:600; }
  main { padding:1rem 1.1rem 3rem; max-width:900px; }
  .card { border:1px solid var(--line); border-radius:11px; padding:.85rem 1rem; margin:.6rem 0; }
  .row { display:flex; gap:.6rem; align-items:flex-start; }
  .grow { flex:1; }
  .name { font-weight:600; }
  .muted { color:var(--mut); font-size:.85rem; }
  a.doc { font-size:.83rem; color:var(--blue); text-decoration:none; }
  a.doc:hover { text-decoration:underline; }
  .flagbtn { font:inherit; border:1px solid var(--line); background:#fff; border-radius:8px;
         padding:.35rem .6rem; cursor:pointer; white-space:nowrap; }
  .flagbtn.on { background:#fde8e7; border-color:#f4b6b3; color:var(--red); font-weight:600; }
  .savebtn { font:inherit; border:1px solid var(--blue); color:var(--blue); background:#fff;
         border-radius:8px; padding:.3rem .7rem; cursor:pointer; }
  .savebtn.saved { border-color:var(--green); color:var(--green); background:#e6f4ea; }
  .rate { display:flex; gap:.25rem; }
  .rate button { width:30px; height:30px; border:1px solid var(--line); background:#fff;
         border-radius:7px; cursor:pointer; font:inherit; }
  .rate button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  textarea { font:inherit; width:100%; border:1px solid var(--line); border-radius:8px;
         padding:.4rem .5rem; margin-top:.4rem; }
  table { border-collapse:collapse; width:100%; font-size:.88rem; }
  th,td { text-align:left; padding:.5rem .5rem; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; }
  .pill { display:inline-block; border-radius:20px; padding:.1rem .55rem; font-size:.75rem; font-weight:600; }
  .pill.ip { background:#e6f4ea; color:var(--green); }
  .pill.zoom { background:#e8eefc; color:#1a3fa0; }
  .pill.m { background:#e8eefc; color:#1a3fa0; }
  .pill.f { background:#fbe9f3; color:#a01a6b; }
  .slotgrid { display:grid; grid-template-columns:1fr auto; gap:.55rem .8rem; align-items:center; }
  .slotgrid .h { color:var(--mut); font-size:.78rem; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { font:inherit; border:none; background:#fff; padding:.3rem .6rem; cursor:pointer;
         font-size:.82rem; border-left:1px solid var(--line); }
  .seg button:first-child { border-left:none; }
  .seg button.on { background:var(--blue); color:#fff; }
  .legend { font-size:.8rem; color:var(--mut); }
  .legend b { color:var(--ink); }
  .note { background:var(--bg); border:1px dashed var(--line); border-radius:9px;
          padding:.55rem .7rem; font-size:.83rem; color:var(--mut); margin:.5rem 0; }
  .panelbox { border:1px solid var(--line); border-radius:10px; padding:.7rem .8rem; margin:.5rem 0; }
  .panelbox.bad { border-color:#f4b6b3; background:#fff7f7; }
  .badges { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.45rem; font-size:.78rem; }
  .badge { border-radius:7px; padding:.12rem .5rem; background:#eef2f7; }
  .badge.ok { background:#e6f4ea; color:var(--green); }
  .badge.bad { background:#fce8e6; color:var(--red); }
  .warn { color:var(--amber); }
  .hidden { display:none; }
  .small { font-size:.8rem; }
  .rankn { color:var(--mut); width:1.6rem; display:inline-block; }
</style>
</head>
<body>
<div id="gate" style="position:fixed; inset:0; background:#fff; z-index:100;
     display:flex; align-items:center; justify-content:center; padding:1rem;">
  <div style="max-width:340px; width:100%; text-align:center;">
    <h2 style="margin:.2rem 0;">ED Physician Hiring</h2>
    <p style="color:#666; font-size:.9rem; margin:.2rem 0 1rem;">Leadership access — enter password to view.</p>
    <input id="gpw" type="password" placeholder="Password" autofocus
      style="font:inherit; width:100%; padding:.55rem .6rem; border:1px solid #ccc; border-radius:9px;" />
    <button id="gbtn" style="font:inherit; width:100%; margin-top:.6rem; padding:.55rem;
      border:none; border-radius:9px; background:#1a56db; color:#fff; cursor:pointer;">Enter</button>
    <div id="gerr" style="color:#c5221f; font-size:.82rem; min-height:1.2em; margin-top:.5rem;"></div>
  </div>
</div>
<div class="mock-banner">MOCK / PROTOTYPE — sample data &amp; fictitious candidate names, for workflow feedback. Nothing is saved.</div>

<header>
  <h1>ED Physician Hiring</h1>
  <p class="sub">Screen → Availability → Panels → Score → Ranking · MGH ED 26-27</p>
  <div class="who"><span>Viewing as</span><select id="whoSel"></select></div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="screen" class="on">1 · Screen</button>
  <button data-tab="availability">2 · Availability</button>
  <button data-tab="panels">3 · Panels</button>
  <button data-tab="score">4 · Score</button>
  <button data-tab="ranking">5 · Ranking (admin)</button>
</nav>

<main>
  <section id="screen"></section>
  <section id="availability" class="hidden"></section>
  <section id="panels" class="hidden"></section>
  <section id="score" class="hidden"></section>
  <section id="ranking" class="hidden"></section>
  <section id="candidate" class="hidden"></section>
</main>

function updateView(){
  const cand = state.mode==="candidate";
  $("#tabs").classList.toggle("hidden", cand);
  ["screen","availability","panels","score","ranking"].forEach(s=> $("#"+s).classList.toggle("hidden", cand || state.tab!==s));

  if(cand) renderCandidate();
  else ({screen:renderScreen, availability:renderAvailability, panels:renderPanels, score:renderScore, ranking:renderRanking}[state.tab])();
}

// ---------- 1 · Screen ----------
function renderScreen(){
  const rated = CANDIDATES.filter(c=>((state.ratings[c]||{})[state.who]||0)>0).length;
  const flagged = CANDIDATES.filter(c=>state.flags[c]&&state.flags[c][state.who]!==undefined).length;
  $("#screen").innerHTML = `
    <div class="note">Review each applicant's CV &amp; cover letter (OneDrive), then <b>flag</b> anyone you
      feel is unqualified (optional reason) and optionally give a <b>1–5 priority rating</b>. Only you and
      leadership see your input.</div>
    <div class="muted small" style="margin:0 0 .5rem;">Your progress: flagged <b>${flagged}</b> · rated <b>${rated}</b> of ${CANDIDATES.length}</div>
    ${CANDIDATES.map((c,i)=>{
      const flagged = !!(state.flags[c]&&state.flags[c][state.who]!==undefined);
      const myReason = flagged? state.flags[c][state.who] : "";
      const myRate = (state.ratings[c]||{})[state.who]||0;
      const saved = state.savedReason[c+"|"+state.who];
      return `<div class="card">
        <div class="row"><div class="grow"><div class="name">${c}</div>
            <a class="doc" href="${ONEDRIVE}" onclick="return false" title="Opens in OneDrive in the live tool">📄 View CV &amp; cover letter (OneDrive)</a></div>
          <button class="flagbtn ${flagged?'on':''}" onclick="toggleFlag(${i})">${flagged?'⚑ Flagged':'Flag concern'}</button></div>
        <div class="row" style="margin-top:.5rem;"><div class="muted small" style="width:110px;">Optional priority</div>
          <div class="rate">${[1,2,3,4,5].map(n=>`<button class="${myRate===n?'on':''}" onclick="setRate(${i},${n})">${n}</button>`).join("")}</div></div>
        ${flagged?`<textarea id="rsn${i}" placeholder="Reason (optional)" oninput="onReasonInput(${i})">${myReason}</textarea>
          <div style="margin-top:.4rem;"><button class="savebtn ${saved?'saved':''}" id="save${i}" onclick="saveReason(${i})">${saved?'Saved ✓':'Save reason'}</button></div>`:''}
      </div>`;
    }).join("")}`;
}
window.toggleFlag = i => { const c=CANDIDATES[i]; state.flags[c]=state.flags[c]||{};
  if(state.flags[c][state.who]!==undefined) delete state.flags[c][state.who]; else state.flags[c][state.who]=""; renderScreen(); };
window.onReasonInput = i => { const c=CANDIDATES[i]; state.flags[c][state.who]=$("#rsn"+i).value;
  state.savedReason[c+"|"+state.who]=false; const b=$("#save"+i); if(b){b.classList.remove("saved"); b.textContent="Save reason";} };
window.saveReason = i => { const c=CANDIDATES[i]; state.savedReason[c+"|"+state.who]=true;
  const b=$("#save"+i); b.classList.add("saved"); b.textContent="Saved ✓"; };
window.setRate = (i,n)=>{ const c=CANDIDATES[i]; state.ratings[c]=state.ratings[c]||{};
  state.ratings[c][state.who]= state.ratings[c][state.who]===n?0:n; renderScreen(); };

// ---------- shared slot control ----------
function slotRows(map, handler){
  return SLOTS.map((s,si)=>{ const cur=map[si];
    const seg=(v,l)=>`<button class="${cur&&cur.mode===v?'on':''}" onclick="${handler}(${si},'${v}')">${l}</button>`;
    return `<div>${s}</div><div><span class="seg">${seg('ip','In person')}${seg('zoom','Zoom')}${seg('either','Either')}</span></div>`;
  }).join("");
}

// ---------- 2 · Availability ----------
function renderAvailability(){
  const av = state.avail[me()] = state.avail[me()] || {};
  $("#availability").innerHTML = `
    <div class="note">For each interview time, choose whether you <b>can</b> do it <b>in person</b>, by
      <b>Zoom</b>, or <b>either</b>. Leave a slot untouched if you're not available. More dates will be added
      as they're confirmed.</div>
    <div class="card"><div class="slotgrid"><div class="h">Slot</div><div class="h">I can do…</div>
      ${slotRows(av,"setMode")}</div></div>
    <div class="note small">Tip: tap a highlighted option again to clear it (marks you unavailable for that slot).</div>`;
}
window.setMode = (si,v)=>{ const av=state.avail[me()];
  if(av[si]&&av[si].mode===v) delete av[si]; else av[si]={mode:v}; renderAvailability(); };

// ---------- 3 · Panels (auto-suggested) ----------
function renderPanels(){
  $("#panels").innerHTML = `
    <div class="note"><b>Auto-suggested panels.</b> Built automatically from everyone's availability into
      balanced panels of the right size. Slots that need a manual fix are flagged.
      <span class="warn">(Sample data — the matching logic is still to be built.)</span></div>
    ${PANELS.map(p=>{
      const size=p.members.length, bad = !!p.warn || !(size>=3&&size<=5);
      return `<div class="panelbox ${bad?'bad':''}">
        <div class="row"><div class="grow"><b>${p.c}</b> · ${SLOTS[p.slot]}
          <span class="pill ${p.mod==='In-person'?'ip':'zoom'}">${p.mod}</span></div>
          <button class="flagbtn">edit</button></div>
        <div class="small" style="margin-top:.3rem;">${p.members.join(" · ")}</div>
        <div class="badges">
          <span class="badge ${size>=3&&size<=5?'ok':'bad'}">${size>=3&&size<=5?'✓':'✗'} ${size} members</span>
          <span class="badge ${bad?'bad':'ok'}">${bad?'✗ composition needs review':'✓ balanced panel'}</span></div>
        ${p.warn?`<div class="small warn" style="margin-top:.35rem;">⚠ ${p.warn}</div>`:''}
      </div>`;
    }).join("")}
    <div class="card"><b>⚠ Needs attention</b>
      <ul style="margin:.4rem 0 0; padding-left:1.1rem;">${ISSUES.map(x=>`<li class="small" style="margin:.2rem 0;">${x}</li>`).join("")}</ul></div>`;
}

// ---------- Candidate booking view ----------
function renderCandidate(){
  const name = CANDIDATES[state.candIdx];
  const av = state.candAvail[name] = state.candAvail[name] || {};
  $("#candidate").innerHTML = `
    <div class="note">This is what an <b>applicant</b> sees after opening the shared link and typing their
      name — no tabs, and no list of other candidates.</div>
    <div class="card"><div class="muted small">Signed in as</div><div class="name">${name}</div></div>
    <div class="card"><b>Select the interview times you can attend</b>
      <div class="muted small" style="margin:.2rem 0 .7rem;">For each time you can make, choose whether you
        <b>can</b> attend in person, by Zoom, or either. <b>In-person interviews are encouraged where possible.</b>
        Leave the rest untouched. You can come back and update.</div>
      <div class="slotgrid"><div class="h">Slot</div><div class="h">I can attend…</div>
        ${slotRows(av,"setCandMode")}</div>
      <div class="row" style="margin-top:.9rem; align-items:center;">
        <button class="savebtn ${state.candSubmitted?'saved':''}" onclick="submitCand()">${state.candSubmitted?'Submitted ✓':'Submit availability'}</button>
        <span class="muted small">You'll be contacted with your interview time.</span></div>
    </div>`;
}
window.setCandMode = (si,v)=>{ const name=CANDIDATES[state.candIdx]; const av=state.candAvail[name];
  if(av[si]&&av[si].mode===v) delete av[si]; else av[si]={mode:v}; state.candSubmitted=false; renderCandidate(); };
window.submitCand = () => { state.candSubmitted=true; renderCandidate(); };

// ---------- 4 · Score ----------
function renderScore(){
  const cand=CANDIDATES[state.scoreCand];
  const notes=state.notes[cand] = state.notes[cand] || [];
  const myScore=(state.scores[cand]||{})[state.who]||0;
  $("#score").innerHTML = `
    <div class="note">Scoring uses the 2026 Interview Guide: notes per question, then <b>one overall 1–5
      rating</b> using your judgement against the guide below. Your score is private to you and leadership.</div>
    <div class="card"><div class="row" style="align-items:center;">
      <div class="muted small" style="width:110px;">Scoring</div>
      <select id="scoreCand" onchange="pickScoreCand(this.value)" style="font:inherit; padding:.35rem .5rem; border:1px solid var(--line); border-radius:8px;">
        ${CANDIDATES.map((c,i)=>`<option value="${i}" ${i===state.scoreCand?'selected':''}>${c}</option>`).join("")}
      </select></div></div>
    ${QUESTIONS.map((q,i)=>`<div class="card"><div class="small muted">Q${i}</div><div>${q}</div>
      <textarea placeholder="Notes" oninput="saveNote(${i},this.value)">${notes[i]||""}</textarea></div>`).join("")}
    <div class="card"><b>Overall rating</b>
      <div class="rate" style="margin:.5rem 0;">${[1,2,3,4,5].map(n=>`<button class="${myScore===n?'on':''}" onclick="setScore(${n})">${n}</button>`).join("")}</div>
      <div class="legend">${SCALE.map((s,i)=>`<div style="margin:.3rem 0;"><b>${i+1}</b> — ${s}</div>`).join("")}</div></div>
    <div class="card"><b>Guidance for panelists</b>
      <ul class="small" style="margin:.4rem 0 0; padding-left:1.1rem;">${GUIDE.map(g=>`<li style="margin:.25rem 0;">${g}</li>`).join("")}</ul></div>`;
}
window.pickScoreCand = v => { state.scoreCand=+v; renderScore(); };
window.saveNote = (qi,val) => { const c=CANDIDATES[state.scoreCand];
  state.notes[c]=state.notes[c]||[]; state.notes[c][qi]=val; };
window.setScore = n => { const c=CANDIDATES[state.scoreCand]; state.scores[c]=state.scores[c]||{};
  state.scores[c][state.who]= state.scores[c][state.who]===n?0:n; renderScore(); };

// ---------- login gate: decrypts the confidential questions + scale ----------
function b64bytes(b){ const s=atob(b), u=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function decryptContent(pw){
  const salt=b64bytes(ENC_SALT), ct=b64bytes(ENC_CIPHER);
  const km=await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations:ENC_ITER, hash:"SHA-256"}, km, ct.length*8);
  const ks=new Uint8Array(bits), pt=new Uint8Array(ct.length);
  for(let i=0;i<ct.length;i++) pt[i]=ct[i]^ks[i];
  const obj=JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(pt)); // throws on wrong password
  if(!Array.isArray(obj.q)||!Array.isArray(obj.s)) throw new Error("bad");
  return obj;
}
async function tryUnlock(pw, silent){
  try{ const d=await decryptContent(pw); QUESTIONS=d.q; SCALE=d.s; GUIDE=d.g||[];
    sessionStorage.setItem("ed_pw",pw); const g=$("#gate"); if(g) g.remove(); updateView(); }
  catch(e){ if(!silent) $("#gerr").textContent="Incorrect password."; }
}
(function initGate(){
  if(!(window.crypto&&window.crypto.subtle)){
    $("#gerr").textContent="Please open the secure https link (not a local file) to view this mock.";
    $("#gbtn").disabled=true; return; }
  const saved=sessionStorage.getItem("ed_pw"); if(saved) tryUnlock(saved,true);
  $("#gbtn").onclick=()=>tryUnlock($("#gpw").value.trim(),false);
  $("#gpw").addEventListener("keydown",e=>{ if(e.key==="Enter") tryUnlock($("#gpw").value.trim(),false); });
})();

// ---------- 5 · Ranking ----------
function renderRanking(){
  const ranked = CANDIDATES.map((c,i)=>({c, avg:FAKE_AVG[i], n:FAKE_N[i]})).sort((a,b)=>b.avg-a.avg);
  $("#ranking").innerHTML = `
    <div class="note"><b>Ranking — admin only.</b> Candidates ordered by average interview score.
      <span class="warn">In the live tool this is a leadership-only view, hidden until all interviews are
      complete, so it can't bias interviewers (shown here with sample data for the mock).</span></div>
    <table><thead><tr><th>#</th><th>Candidate</th><th>Avg score</th><th># scored</th></tr></thead>
      <tbody>${ranked.map((r,i)=>`<tr><td class="rankn">${i+1}</td><td>${r.c}</td>
        <td><b>${r.avg.toFixed(1)}</b></td><td>${r.n}</td></tr>`).join("")}</tbody></table>`;
}
