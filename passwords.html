<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>ED tools passwords</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/ed-ui.css?v=R8" />
<link rel="stylesheet" href="css/styles.css?v=R8" />
</head>
<body>
<!-- Leadership only. The page signs in to the Leadership account with what is
     typed; nothing is kept but Firebase's own sign-in for this tab. -->
<div id="gate" class="overlay" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="overlay-box" role="main">
    <div class="logo" aria-hidden="true">ED</div>
    <h2 id="gateTitle">ED tools passwords</h2>
    <p class="muted">Change the Leadership, ED and Guest passwords. Enter the Leadership password to continue.</p>
    <form id="gateForm" autocomplete="off">
      <label class="ed-label gatelabel" for="gpw">Leadership password
        <input id="gpw" type="password" autocomplete="off" autofocus /></label>
      <button id="gbtn" class="primary" type="submit">Enter</button>
    </form>
    <div id="gerr" class="err" role="alert" aria-live="assertive"></div>
  </div>
</div>

<header id="appHeader" class="hidden">
  <div class="brandrow">
    <div class="brandmark" aria-hidden="true">ED</div>
    <div class="grow"><h1>ED tools passwords</h1></div>
    <button id="logout" class="linky">Log out</button>
  </div>
</header>

<main id="pwApp" class="hidden"></main>

<!-- multi-step dialog (util.js flowDialog) -->
<div id="flowWrap" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="flowTitle">
  <div class="overlay-box flowbox">
    <h2 id="flowTitle"></h2>
    <div id="flowBody"></div>
    <div id="flowBtns" class="row flowbtns"></div>
  </div>
</div>

<div id="toast" class="toast hide" role="status" aria-live="polite"></div>

<!-- Last-resort net (as in index.html): if the module never runs, say so. ES5. -->
<script>
(function () {
  var shown = false;
  function fatal(msg) {
    if (shown) return;
    shown = true;
    var e = document.getElementById("gerr");
    if (e) e.innerHTML = '<div style="text-align:left">' + msg + "</div>";
  }
  window.addEventListener("error", function (ev) {
    var m = (ev && ev.message) || "";
    if (/SyntaxError|Unexpected token|Unexpected identifier|is not a function|is not a constructor/.test(m))
      fatal("This browser can’t run this page. It is most likely too old. Update iOS or Android, or try another device.");
  });
  window.addEventListener("DOMContentLoaded", function () {
    setTimeout(function () {
      if (!window.__edReady)
        fatal("The page didn’t finish loading. Reload. If you are on a hospital network or using a content blocker, try mobile data.");
    }, 8000);
  });
})();
</script>
<script type="module" src="js/pwpage.js?v=R8"></script>
</body>
</html>
